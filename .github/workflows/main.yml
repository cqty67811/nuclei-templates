name: Sync nuclei-templates to Gitee

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream and push to Gitee
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/projectdiscovery/nuclei-templates.git
          git fetch upstream main

          git checkout main
          git merge upstream/main --no-edit || git merge upstream/main --no-edit -X ours

          git remote add gitee https://ksaliang:${{ secrets.GITEE_TOKEN }}@gitee.com/ksaliang/nuclei-templates.git
          git push gitee main --force
